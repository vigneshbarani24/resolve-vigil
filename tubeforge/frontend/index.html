<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TubeForge — AI Video Studio</title>
  <link rel="stylesheet" href="/static/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>" />
</head>
<body>

  <!-- ============================================================ -->
  <!-- HEADER                                                        -->
  <!-- ============================================================ -->
  <header id="app-header">
    <div class="header-left">
      <h1 class="logo">Tube<span class="logo-accent">Forge</span></h1>
      <span class="tagline">AI Video Studio</span>
    </div>
    <div class="header-right">
      <div id="connection-status" class="status-indicator disconnected">
        <span class="status-dot"></span>
        <span class="status-text">Disconnected</span>
      </div>
    </div>
  </header>

  <!-- ============================================================ -->
  <!-- MAIN LAYOUT (2 columns)                                      -->
  <!-- ============================================================ -->
  <main id="app-main">

    <!-- LEFT COLUMN: Chat ======================================= -->
    <section id="chat-panel" class="panel">

      <!-- Niche Preset Buttons -->
      <div id="niche-presets" class="niche-bar">
        <button class="niche-btn" data-niche="documentary">Documentary</button>
        <button class="niche-btn" data-niche="facts">Facts</button>
        <button class="niche-btn" data-niche="story">Story</button>
        <button class="niche-btn" data-niche="explainer">Explainer</button>
        <button class="niche-btn" data-niche="horror">Horror</button>
        <button class="niche-btn" data-niche="history">History</button>
      </div>

      <!-- Chat Messages -->
      <div id="chat-messages" class="chat-messages">
        <div class="system-message">
          <p>Welcome to <strong>TubeForge</strong>. Upload a photo or describe your video idea to get started.</p>
        </div>
      </div>

      <!-- Input Controls -->
      <div id="chat-input-bar" class="chat-input-bar">
        <div class="input-row">
          <input
            type="text"
            id="text-input"
            class="text-input"
            placeholder="Describe your video idea..."
            autocomplete="off"
          />
          <button id="send-btn" class="icon-btn send-btn" title="Send message">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M22 2L11 13" /><path d="M22 2L15 22L11 13L2 9L22 2Z" />
            </svg>
          </button>
        </div>
        <div class="controls-row">
          <button id="audio-btn" class="icon-btn" title="Start audio (mic)">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z" />
              <path d="M19 10v2a7 7 0 0 1-14 0v-2" /><line x1="12" y1="19" x2="12" y2="23" />
              <line x1="8" y1="23" x2="16" y2="23" />
            </svg>
            <span class="btn-label">Mic</span>
          </button>
          <button id="camera-btn" class="icon-btn" title="Capture from camera">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z" />
              <circle cx="12" cy="13" r="4" />
            </svg>
            <span class="btn-label">Camera</span>
          </button>
          <button id="upload-btn" class="icon-btn" title="Upload photo">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
              <polyline points="17 8 12 3 7 8" /><line x1="12" y1="3" x2="12" y2="15" />
            </svg>
            <span class="btn-label">Upload</span>
          </button>
          <input type="file" id="file-input" accept="image/*" hidden />
        </div>
      </div>
    </section>

    <!-- RIGHT COLUMN: Preview =================================== -->
    <section id="preview-panel" class="panel">
      <h2 class="panel-title">Preview</h2>

      <!-- Progress Bar -->
      <div id="progress-section" class="progress-section hidden">
        <div class="progress-label">
          <span id="progress-stage">Preparing...</span>
          <span id="progress-percent">0%</span>
        </div>
        <div class="progress-track">
          <div id="progress-bar" class="progress-bar" style="width: 0%"></div>
        </div>
      </div>

      <!-- Script Segments -->
      <div id="script-segments" class="script-segments">
        <div class="empty-state">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" opacity="0.4">
            <polygon points="23 7 16 12 23 17 23 7" /><rect x="1" y="5" width="15" height="14" rx="2" ry="2" />
          </svg>
          <p>Your video preview will appear here</p>
        </div>
      </div>

      <!-- Video Player -->
      <div id="video-player-section" class="video-player-section hidden">
        <video id="video-player" class="video-player" controls></video>
        <a id="download-btn" class="download-btn hidden" href="#" download>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
            <polyline points="7 10 12 15 17 10" /><line x1="12" y1="15" x2="12" y2="3" />
          </svg>
          Download Video
        </a>
      </div>
    </section>
  </main>

  <!-- ============================================================ -->
  <!-- CAMERA MODAL                                                  -->
  <!-- ============================================================ -->
  <div id="camera-modal" class="modal hidden">
    <div class="modal-backdrop"></div>
    <div class="modal-content">
      <div class="modal-header">
        <h3>Camera Capture</h3>
        <button id="camera-modal-close" class="modal-close">&times;</button>
      </div>
      <div class="modal-body">
        <video id="camera-preview" class="camera-preview" autoplay playsinline muted></video>
        <canvas id="camera-canvas" class="hidden"></canvas>
      </div>
      <div class="modal-footer">
        <button id="camera-capture-btn" class="primary-btn">Capture Photo</button>
      </div>
    </div>
  </div>

  <!-- ============================================================ -->
  <!-- TOAST CONTAINER                                               -->
  <!-- ============================================================ -->
  <div id="toast-container" class="toast-container"></div>

  <!-- ============================================================ -->
  <!-- JS (ES modules)                                               -->
  <!-- ============================================================ -->
  <script type="module" src="/static/src/main.js"></script>

</body>
</html>
