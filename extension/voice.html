<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vigil Voice</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0b10;
      --surface: rgba(22, 24, 34, 0.95);
      --text: #f0e6d9;
      --text-sub: #b0b8c4;
      --primary: #4d9ff7;
      --danger: #e57373;
      --success: #81c784;
      --border: rgba(255, 255, 255, 0.08);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Nunito', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    .header {
      padding: 20px;
      text-align: center;
    }

    .header h1 {
      font-size: 18px;
      font-weight: 800;
    }

    .header p {
      font-size: 12px;
      color: var(--text-sub);
      margin-top: 4px;
    }

    .status {
      font-size: 13px;
      font-weight: 700;
      margin: 8px 0;
      color: var(--text-sub);
      transition: color 0.3s;
    }

    .status.listening { color: var(--success); }
    .status.speaking { color: var(--primary); }
    .status.error { color: var(--danger); }

    .mic-btn {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      border: 3px solid var(--border);
      background: var(--surface);
      color: var(--text-sub);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      transition: all 0.3s;
      margin: 16px 0;
    }

    .mic-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    .mic-btn.active {
      border-color: var(--danger);
      background: rgba(229, 115, 115, 0.1);
      color: var(--danger);
      animation: glow 2s ease-in-out infinite;
    }

    @keyframes glow {
      0%, 100% { box-shadow: 0 0 0 0 rgba(229, 115, 115, 0); }
      50% { box-shadow: 0 0 24px 8px rgba(229, 115, 115, 0.25); }
    }

    .mic-btn svg { width: 36px; height: 36px; }

    .transcript {
      flex: 1;
      width: calc(100% - 32px);
      margin: 0 16px;
      overflow-y: auto;
      background: rgba(16, 18, 28, 0.8);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .transcript-empty {
      font-size: 12px;
      color: var(--text-sub);
      text-align: center;
      opacity: 0.6;
      padding: 20px;
      line-height: 1.6;
    }

    .entry {
      font-size: 12px;
      line-height: 1.5;
      padding: 6px 10px;
      border-radius: 8px;
      animation: fadeIn 0.2s ease-out;
    }

    .entry.user {
      background: rgba(77, 159, 247, 0.1);
      color: var(--primary);
      border-left: 3px solid var(--primary);
    }

    .entry.agent {
      background: rgba(129, 199, 132, 0.08);
      color: var(--text);
      border-left: 3px solid var(--success);
    }

    .entry.tool {
      background: rgba(167, 139, 250, 0.08);
      color: var(--text-sub);
      font-size: 11px;
      border-left: 3px solid #a78bfa;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .footer {
      padding: 12px;
      font-size: 10px;
      color: var(--text-sub);
      opacity: 0.5;
      text-align: center;
    }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 9999px; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Vigil Voice</h1>
    <p>Talk to your AI security agent</p>
  </div>

  <div class="status" id="status">Connecting...</div>

  <button class="mic-btn" id="mic-btn">
    <svg viewBox="0 0 24 24" fill="currentColor">
      <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
      <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
    </svg>
  </button>

  <div class="transcript" id="transcript">
    <div class="transcript-empty">
      Ask anything:<br>
      "Is this page safe?"<br>
      "Help me find the submit button"<br>
      "I'm getting error AUTH-003"
    </div>
  </div>

  <div class="footer">Vigil — Powered by Gemini Live</div>

  <script>
    const $status = document.getElementById('status');
    const $micBtn = document.getElementById('mic-btn');
    const $transcript = document.getElementById('transcript');

    // Parse params from URL
    const params = new URLSearchParams(window.location.search);
    const wsUrl = params.get('ws');
    const setupMessage = JSON.parse(params.get('setup') || '{}');

    let ws = null;
    let audioCtx = null;
    let micStream = null;
    let scriptNode = null;
    let sourceNode = null;
    let playbackCtx = null;
    let isActive = false;
    let playbackQueue = [];
    let isPlaying = false;

    function addEntry(role, text) {
      const empty = $transcript.querySelector('.transcript-empty');
      if (empty) empty.remove();

      const el = document.createElement('div');
      el.className = `entry ${role}`;
      el.textContent = text;
      $transcript.appendChild(el);
      $transcript.scrollTop = $transcript.scrollHeight;
    }

    function setStatus(text, cls) {
      $status.textContent = text;
      $status.className = `status ${cls || ''}`;
    }

    async function start() {
      if (!wsUrl) {
        setStatus('No connection info', 'error');
        return;
      }

      try {
        // 1. Get mic
        micStream = await navigator.mediaDevices.getUserMedia({
          audio: { sampleRate: 16000, channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true },
        });

        // 2. Open WebSocket
        ws = new WebSocket(wsUrl);
        ws.binaryType = 'arraybuffer';

        ws.onopen = () => {
          ws.send(JSON.stringify(setupMessage));
          isActive = true;
          $micBtn.classList.add('active');
          setStatus('Listening...', 'listening');

          // Start capture
          audioCtx = new AudioContext({ sampleRate: 16000 });
          sourceNode = audioCtx.createMediaStreamSource(micStream);
          scriptNode = audioCtx.createScriptProcessor(4096, 1, 1);

          scriptNode.onaudioprocess = (e) => {
            if (!isActive || !ws || ws.readyState !== WebSocket.OPEN) return;
            const f32 = e.inputBuffer.getChannelData(0);
            const i16 = new Int16Array(f32.length);
            for (let i = 0; i < f32.length; i++) {
              const s = Math.max(-1, Math.min(1, f32[i]));
              i16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
            }
            ws.send(i16.buffer);
          };

          sourceNode.connect(scriptNode);
          scriptNode.connect(audioCtx.destination);
        };

        ws.onmessage = (event) => {
          if (event.data instanceof ArrayBuffer) {
            playChunk(event.data);
            return;
          }
          try {
            const msg = JSON.parse(event.data);

            const inp = msg?.serverContent?.inputTranscription;
            if (inp && inp.text) addEntry('user', inp.text);

            const out = msg?.serverContent?.outputTranscription;
            if (out && out.text) {
              addEntry('agent', out.text);
              setStatus('Speaking...', 'speaking');
            }

            if (msg?.serverContent?.turnComplete) {
              setStatus('Listening...', 'listening');
            }

            if (msg?.type === 'tool_call' || msg?.type === 'server_tool_call') {
              const name = msg.name || msg.tool || 'tool';
              addEntry('tool', `Tool: ${name}`);
            }
          } catch {}
        };

        ws.onclose = () => {
          stop();
          setStatus('Session ended', '');
        };

        ws.onerror = () => {
          setStatus('Connection error', 'error');
          stop();
        };

      } catch (err) {
        setStatus(err.message || 'Mic denied', 'error');
      }
    }

    function playChunk(buf) {
      if (!playbackCtx) playbackCtx = new AudioContext({ sampleRate: 24000 });

      const i16 = new Int16Array(buf);
      const f32 = new Float32Array(i16.length);
      for (let i = 0; i < i16.length; i++) f32[i] = i16[i] / 0x7FFF;

      const abuf = playbackCtx.createBuffer(1, f32.length, 24000);
      abuf.getChannelData(0).set(f32);
      playbackQueue.push(abuf);
      drainQueue();
    }

    function drainQueue() {
      if (isPlaying || playbackQueue.length === 0) return;
      isPlaying = true;
      const buf = playbackQueue.shift();
      const src = playbackCtx.createBufferSource();
      src.buffer = buf;
      src.connect(playbackCtx.destination);
      src.onended = () => { isPlaying = false; drainQueue(); };
      src.start();
    }

    function stop() {
      isActive = false;
      if (scriptNode) { scriptNode.disconnect(); scriptNode = null; }
      if (sourceNode) { sourceNode.disconnect(); sourceNode = null; }
      if (audioCtx) { audioCtx.close().catch(() => {}); audioCtx = null; }
      if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
      if (ws) { ws.close(); ws = null; }
      if (playbackCtx) { playbackCtx.close().catch(() => {}); playbackCtx = null; }
      playbackQueue = [];
      isPlaying = false;
      $micBtn.classList.remove('active');
    }

    $micBtn.addEventListener('click', () => {
      if (isActive) {
        stop();
        setStatus('Tap to reconnect', '');
      } else {
        start();
      }
    });

    // Auto-start on open
    start();
  </script>
</body>
</html>
