<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="popup-header">
      <div class="logo-row">
        <div class="logo-icon" id="logo-icon">V</div>
        <div>
          <h1>Vigil</h1>
          <p class="tagline" id="tagline">Scam, Spam & AI Content Shield</p>
        </div>
      </div>
      <div class="status-row">
        <span class="status-dot" id="status-dot"></span>
        <span class="status-text" id="status-text">Disconnected</span>
      </div>
    </header>

    <!-- Settings Section -->
    <section class="section" id="settings-section">
      <div class="input-group">
        <label for="server-url">Server URL</label>
        <input type="text" id="server-url" placeholder="http://localhost:8080" />
      </div>
      <div class="input-group">
        <label for="language-select">Language</label>
        <select id="language-select"></select>
      </div>
      <button class="btn btn-primary" id="connect-btn">Connect</button>
    </section>

    <!-- ═══ SHIELD MODE ═══ -->
    <section class="section hidden" id="shield-section">
      <div class="shield-status" id="shield-status">
        <div class="shield-icon" id="shield-icon">&#x1F6E1;</div>
        <div class="shield-info">
          <span class="shield-title" id="shield-title">Shield Active</span>
          <span class="shield-subtitle" id="shield-subtitle">Auto-scanning pages for threats</span>
        </div>
        <label class="toggle-switch">
          <input type="checkbox" id="shield-toggle" checked />
          <span class="toggle-slider"></span>
        </label>
      </div>

      <!-- Shield scan result -->
      <div class="shield-result hidden" id="shield-result">
        <div class="shield-verdict" id="shield-verdict">
          <span class="verdict-icon" id="verdict-icon"></span>
          <div class="verdict-info">
            <span class="verdict-level" id="verdict-level"></span>
            <span class="verdict-text" id="verdict-text"></span>
          </div>
        </div>
        <div class="threat-details" id="threat-details"></div>
      </div>

      <div class="shield-actions">
        <button class="btn btn-shield" id="scan-now-btn">
          <span class="btn-icon">&#x1F50D;</span> Scan This Page
        </button>
        <button class="btn btn-clear hidden" id="clear-shield-btn">Clear</button>
      </div>
    </section>

    <!-- ═══ ASSIST MODE ═══ -->
    <section class="section hidden" id="assist-section">
      <div class="assist-header">
        <span class="assist-icon">&#x1F9ED;</span>
        <div class="assist-info">
          <span class="assist-title">Page Assist</span>
          <span class="assist-subtitle">Ask where to find anything on this page</span>
        </div>
      </div>

      <div class="input-group">
        <label for="assist-input">What do you need help with?</label>
        <div class="assist-input-row">
          <input type="text" id="assist-input" placeholder="e.g. Find the submit button" />
          <button class="btn btn-primary btn-guide" id="guide-btn">Guide Me</button>
        </div>
      </div>

      <div class="assist-result hidden" id="assist-result">
        <div class="explanation" id="assist-explanation"></div>
        <div class="assist-actions-row">
          <span class="assist-action-count" id="assist-action-count"></span>
          <button class="btn btn-secondary btn-execute" id="execute-all-btn">Execute All</button>
        </div>
      </div>
    </section>

    <!-- Live Status Bar -->
    <div class="live-status" id="live-status">
      <div class="live-status-header">
        <span class="live-dot"></span>
        <span class="live-label">Live Status</span>
      </div>
      <div class="live-status-body" id="live-status-body">
        <div class="status-line" id="status-tab">
          <span class="status-key">Tab</span>
          <span class="status-val" id="status-tab-val">—</span>
        </div>
        <div class="status-line" id="status-url">
          <span class="status-key">URL</span>
          <span class="status-val" id="status-url-val">—</span>
        </div>
        <div class="status-line" id="status-last-scan">
          <span class="status-key">Last Scan</span>
          <span class="status-val" id="status-last-scan-val">—</span>
        </div>
        <div class="status-line" id="status-verdict">
          <span class="status-key">Verdict</span>
          <span class="status-val" id="status-verdict-val">—</span>
        </div>
        <div class="status-line" id="status-server">
          <span class="status-key">Server</span>
          <span class="status-val" id="status-server-val">—</span>
        </div>
      </div>
    </div>

    <!-- Loading -->
    <div class="loading hidden" id="loading">
      <div class="spinner"></div>
      <span id="loading-text">Scanning...</span>
    </div>

    <!-- Error -->
    <div class="error hidden" id="error"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
