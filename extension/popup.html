<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="popup-header">
      <div class="logo-row">
        <div class="logo-icon" id="logo-icon">R</div>
        <div>
          <h1>Resolve</h1>
          <p class="tagline" id="tagline">AI Visual Guidance</p>
        </div>
      </div>
      <div class="status-row">
        <span class="status-dot" id="status-dot"></span>
        <span class="status-text" id="status-text">Disconnected</span>
      </div>
    </header>

    <!-- Mode Toggle -->
    <div class="mode-toggle" id="mode-toggle">
      <button class="mode-btn active" id="mode-shield" data-mode="shield">
        <span class="mode-icon">&#x1F6E1;</span>
        <span>Vigil</span>
      </button>
      <button class="mode-btn" id="mode-assist" data-mode="assist">
        <span class="mode-icon">&#x1F9ED;</span>
        <span>Assist</span>
      </button>
    </div>

    <!-- Settings Section -->
    <section class="section" id="settings-section">
      <div class="input-group">
        <label for="server-url">Server URL</label>
        <input type="text" id="server-url" placeholder="http://localhost:8080" />
      </div>
      <div class="input-group">
        <label for="language-select">Language</label>
        <select id="language-select"></select>
      </div>
      <button class="btn btn-primary" id="connect-btn">Connect</button>
    </section>

    <!-- ═══ SHIELD MODE ═══ -->
    <section class="section hidden" id="shield-section">
      <div class="shield-status" id="shield-status">
        <div class="shield-icon" id="shield-icon">&#x1F6E1;</div>
        <div class="shield-info">
          <span class="shield-title" id="shield-title">Shield Active</span>
          <span class="shield-subtitle" id="shield-subtitle">Auto-scanning pages for threats</span>
        </div>
        <label class="toggle-switch">
          <input type="checkbox" id="shield-toggle" checked />
          <span class="toggle-slider"></span>
        </label>
      </div>

      <!-- Shield scan result -->
      <div class="shield-result hidden" id="shield-result">
        <div class="shield-verdict" id="shield-verdict">
          <span class="verdict-icon" id="verdict-icon"></span>
          <div class="verdict-info">
            <span class="verdict-level" id="verdict-level"></span>
            <span class="verdict-text" id="verdict-text"></span>
          </div>
        </div>
        <div class="threat-details" id="threat-details"></div>
      </div>

      <button class="btn btn-shield" id="scan-now-btn">
        <span class="btn-icon">&#x1F50D;</span> Scan This Page
      </button>
    </section>

    <!-- ═══ ASSIST MODE ═══ -->
    <section class="section hidden" id="analyze-section">
      <div class="input-group">
        <label for="query-input">What do you need help with?</label>
        <textarea id="query-input" rows="2" placeholder="e.g., Where do I upload my documents?"></textarea>
      </div>

      <div class="btn-row">
        <button class="btn btn-primary" id="analyze-btn">
          <span class="btn-icon">&#x1F50D;</span> Analyze Page
        </button>
        <button class="btn btn-secondary" id="clear-btn">Clear</button>
      </div>

      <div class="btn-row">
        <button class="btn btn-accent" id="screenshare-btn">
          <span class="btn-icon">&#x1F4F9;</span> Share Screen
        </button>
      </div>

      <!-- Results -->
      <div class="results hidden" id="results">
        <div class="results-header">
          <span>Guidance</span>
          <button class="btn-link" id="execute-btn">Execute All</button>
        </div>
        <div id="results-body"></div>
      </div>

      <!-- Explanation -->
      <div class="explanation hidden" id="explanation"></div>
    </section>

    <!-- Loading -->
    <div class="loading hidden" id="loading">
      <div class="spinner"></div>
      <span id="loading-text">Analyzing page...</span>
    </div>

    <!-- Error -->
    <div class="error hidden" id="error"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
